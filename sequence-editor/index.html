<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>序列帧动画编辑器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🎞️</span>
    <h1>序列帧动画编辑器</h1>
  </div>
  <div class="top-info">
    <span id="totalInfo">正在加载清单…</span>
  </div>
</header>

<main class="layout">

  <!-- 左侧：角色列表 -->
  <aside class="sidebar">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="🔍 搜索角色…" autocomplete="off" spellcheck="false">
      <span id="matchCount" class="match-count"></span>
    </div>
    <ul id="charList" class="char-list"></ul>
  </aside>

  <!-- 右侧：舞台 -->
  <section class="stage">

    <!-- 动作标签页 -->
    <nav id="actionTabs" class="action-tabs">
      <div id="actionTabList" class="action-tab-list"></div>
      <button id="btnImportAction" class="action-tab import-tab" title="为当前角色导入新动作的序列帧图片">＋ 导入动作</button>
    </nav>

    <div class="stage-body">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="previewCanvas"></canvas>
        <div id="emptyHint" class="empty-hint">👈 请从左侧选择一个角色</div>
      </div>

      <div class="info-bar">
        <span id="infoChar" class="chip">—</span>
        <span id="infoAction" class="chip">—</span>
        <span id="infoFrame" class="chip">帧 —</span>
        <span id="infoSize" class="chip">—</span>
      </div>

      <div class="controls">
        <div class="ctrl-group">
          <button id="btnPrev" class="btn" title="上一帧 (←)">⏮</button>
          <button id="btnPlay" class="btn primary" title="播放/暂停 (空格)">▶</button>
          <button id="btnNext" class="btn" title="下一帧 (→)">⏭</button>
          <button id="btnStop" class="btn" title="回到第一帧">⏹</button>
        </div>

        <div class="ctrl-group grow">
          <input id="frameSlider" type="range" min="0" max="0" value="0" title="拖动选择帧">
          <span id="frameLabel" class="mono">0/0</span>
        </div>

        <div class="ctrl-group">
          <span class="ctl-label">速度</span>
          <input id="fpsSlider" type="range" min="1" max="30" value="10" title="每秒帧数">
          <span id="fpsLabel" class="mono">10</span>
        </div>

        <label class="toggle">
          <input id="loopToggle" type="checkbox" checked>
          <span>循环</span>
        </label>

        <label class="toggle">
          <input id="onionToggle" type="checkbox">
          <span>洋葱皮</span>
        </label>

        <select id="zoomSelect" class="zoom-select" title="缩放">
          <option value="fit">适应窗口</option>
          <option value="0.5">50%</option>
          <option value="1">100%</option>
          <option value="2">200%</option>
          <option value="3">300%</option>
        </select>

        <div class="ctrl-group export-group">
          <button id="btnPivot" class="btn export pivot-btn" title="设置重心点：点击画布或手动输入坐标">⚓ 重心点</button>
          <span class="pivot-coords" id="pivotCoords" style="display:none">
            <label>X</label>
            <button class="pivot-step" data-axis="x" data-dir="-1" title="X -1">◂</button>
            <input id="pivotInputX" type="number" class="pivot-input" min="0" step="1" title="重心点 X 坐标">
            <button class="pivot-step" data-axis="x" data-dir="1" title="X +1">▸</button>
            <label>Y</label>
            <button class="pivot-step" data-axis="y" data-dir="-1" title="Y -1">◂</button>
            <input id="pivotInputY" type="number" class="pivot-input" min="0" step="1" title="重心点 Y 坐标">
            <button class="pivot-step" data-axis="y" data-dir="1" title="Y +1">▸</button>
          </span>
          <button id="btnExportGif" class="btn export" title="把当前动作导出为 GIF 动图">导出 GIF</button>
          <button id="btnExportSprite" class="btn export" title="把当前动作所有帧拼成一张雪碧图">导出雪碧图</button>
          <button id="btnExportAtlas" class="btn export" title="自动裁剪空白，以重心点对齐，导出当前角色全部动作的图集 PNG + JSON 元数据">📦 导出图集</button>
        </div>
      </div>
    </div>

    <!-- 帧带 -->
    <div id="filmstrip" class="filmstrip"></div>
  </section>
</main>

<!-- 上传弹窗 -->
<div id="uploadModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3>＋ 导入新动作</h3>
      <button id="uploadClose" class="modal-close" title="关闭">✕</button>
    </div>
    <p class="modal-hint">为角色 <b id="uploadCharName" class="mono"></b> 添加新的动作序列帧</p>

    <div class="form-row">
      <label class="form-label">动作名</label>
      <input id="uploadActionName" class="form-input" type="text" placeholder="如 Skill / Jump / Attack" maxlength="40" autocomplete="off" spellcheck="false">
    </div>

    <div class="form-row">
      <label class="form-label">帧图片</label>
      <label class="file-picker">
        <span id="uploadFilesLabel">选择 PNG 图片（可多选，按顺序排列）</span>
        <input id="uploadFiles" type="file" accept="image/png,image/*" multiple hidden>
      </label>
    </div>

    <div id="uploadPreview" class="upload-preview"></div>

    <div class="upload-msg" id="uploadMsg"></div>

    <div class="modal-actions">
      <button id="uploadCancel" class="btn">取消</button>
      <button id="uploadSubmit" class="btn primary" disabled>上传</button>
    </div>
  </div>
</div>

<script src="vendor/omggif.js"></script>
<script src="app.js"></script>
</body>
</html>
